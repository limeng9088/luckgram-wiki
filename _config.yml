# GitHub Pages (Jekyll) settings for wiki.luckgram.cc
title: Luckgram Help Center
description: Luckgram 帮助中心：Luckgram 是一款非官方 Telegram 客户端。中文为默认语言，英文版位于 /en/。
lang: zh-CN

plugins:
  - jekyll-readme-index      # serve README.md as each directory's index.html
  - jekyll-relative-links    # rewrite links to .md files into .html
  - jekyll-optional-front-matter

readme_index:
  enabled: true
  remove_originals: false

relative_links:
  enabled: true
  collections: false

defaults:
  - scope: {path: ""}
    values: {lang: zh_CN}
  - scope: {path: "en"}
    values: {lang: en_US}
  - scope: {path: "docs"}
    values: {lang: en_US}

exclude:
  - scripts/
  - .markdownlint-cli2.jsonc
  - .DS_Store
